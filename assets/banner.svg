<svg width="1600" height="500" viewBox="0 0 1600 500" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>

    <radialGradient id="blueGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleGlow" cx="70%" cy="65%" r="40%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="90"/>
    </filter>

  </defs>

  <!-- Background -->
  <rect width="1600" height="500" fill="url(#bg)"/>

  <!-- Glow -->
  <circle cx="520" cy="170" r="170" fill="url(#blueGlow)" filter="url(#blur)"/>
  <circle cx="1120" cy="320" r="190" fill="url(#purpleGlow)" filter="url(#blur)"/>

  <!-- Grid -->
  <g opacity="0.05">
    <path d="M0 100H1600" stroke="white"/>
    <path d="M0 200H1600" stroke="white"/>
    <path d="M0 300H1600" stroke="white"/>
    <path d="M0 400H1600" stroke="white"/>

    <path d="M200 0V500" stroke="white"/>
    <path d="M400 0V500" stroke="white"/>
    <path d="M600 0V500" stroke="white"/>
    <path d="M800 0V500" stroke="white"/>
    <path d="M1000 0V500" stroke="white"/>
    <path d="M1200 0V500" stroke="white"/>
    <path d="M1400 0V500" stroke="white"/>
  </g>

  <!-- Name -->
  <text
      x="800"
      y="195"
      text-anchor="middle"
      fill="white"
      font-size="72"
      font-family="Inter, Segoe UI, Arial, sans-serif"
      font-weight="700"
      letter-spacing="10">
      JHOBET
  </text>

  <!-- Divider -->
  <line
      x1="650"
      x2="950"
      y1="225"
      y2="225"
      stroke="#3B82F6"
      stroke-width="2"
      opacity="0.8"/>

  <!-- Tagline -->
  <text
      x="800"
      y="285"
      text-anchor="middle"
      fill="#B8C1CC"
      font-size="28"
      font-family="Inter, Segoe UI, Arial, sans-serif"
      letter-spacing="2">

      Building software.
  </text>

  <text
      x="800"
      y="325"
      text-anchor="middle"
      fill="#B8C1CC"
      font-size="28"
      font-family="Inter, Segoe UI, Arial, sans-serif"
      letter-spacing="2">

      Building automation.
  </text>

  <text
      x="800"
      y="365"
      text-anchor="middle"
      fill="#B8C1CC"
      font-size="28"
      font-family="Inter, Segoe UI, Arial, sans-serif"
      letter-spacing="2">

      Building startups.
  </text>

</svg>